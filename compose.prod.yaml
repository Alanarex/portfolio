# Production stack for the VPS. Usage: see docs/operations/deployment.md.
# Only Caddy is exposed (80/443); PostgreSQL and Redis stay on the private Docker network.
name: portfolio

x-app: &app
  image: portfolio-app:${RELEASE:-latest}
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: production
  env_file: .env
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    LOG_CHANNEL: stderr
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    SESSION_SECURE_COOKIE: "true"
  volumes:
    - app_storage:/var/www/html/storage
  restart: unless-stopped
  init: true
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    command: php-fpm
    healthcheck:
      test: ["CMD-SHELL", "php artisan portfolio:health --quiet"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  queue:
    <<: *app
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=90 --no-interaction
    stop_grace_period: 95s

  scheduler:
    <<: *app
    command: php artisan schedule:work --no-interaction

  web:
    image: portfolio-web:${RELEASE:-latest}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      - app

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      PGADMIN_AUTH_USER: ${PGADMIN_AUTH_USER:-}
      PGADMIN_AUTH_HASH: ${PGADMIN_AUTH_HASH:-}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # Database administration. Not part of the normal stack: start it only when needed with
  #   docker compose -f compose.prod.yaml --profile admin up -d pgadmin
  # and stop it afterwards. Reachable only through Caddy on db.${APP_DOMAIN} (basic auth + own login).
  pgadmin:
    image: dpage/pgadmin4:9.19.0
    profiles: ["admin"]
    restart: unless-stopped
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-}
      PGADMIN_LISTEN_PORT: "8080" # unprivileged port: no-new-privileges forbids binding 80
      PGADMIN_DISABLE_POSTFIX: "true"
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      PGADMIN_CONFIG_SESSION_COOKIE_SECURE: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_MAX_LOGIN_ATTEMPTS: "3"
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  app_storage:
  postgres_data:
  redis_data:
  pgadmin_data:
  caddy_data:
  caddy_config:
