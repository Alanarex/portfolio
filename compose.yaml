# Local development stack: http://localhost:8080 (Mailpit on http://localhost:8025).
name: portfolio

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: development
  env_file:
    - path: .env
      required: false
  environment:
    APP_ENV: local
    APP_DEBUG: "true"
    APP_URL: http://localhost:8080
    LOG_CHANNEL: stderr
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: ${DB_DATABASE:-portfolio}
    DB_USERNAME: ${DB_USERNAME:-portfolio}
    DB_PASSWORD: ${DB_PASSWORD:-change-me-locally}
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: "1025"
  volumes:
    - .:/var/www/html
  init: true
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    command: php-fpm

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-portfolio}
      POSTGRES_USER: ${DB_USERNAME:-portfolio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-locally}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  queue:
    <<: *app
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=90 --no-interaction

  scheduler:
    <<: *app
    command: php artisan schedule:work --no-interaction

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data:
  redis_data:
