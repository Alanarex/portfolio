# The private administration is never linked publicly and must never be indexed.
map $request_uri $portfolio_robots {
    ~^/(dashboard|login|logout)  "noindex, nofollow";
    default                      "";
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 16m;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header X-Robots-Tag $portfolio_robots always;

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Modèle 3D (5 Mo) : mis en cache longtemps par le navigateur, les visites suivantes sont instantanées.
    location /models/ {
        types { model/gltf-binary glb; }
        default_type model/gltf-binary;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 60s;
        # Laravel émet les mêmes en-têtes que ci-dessus : on garde la valeur de Nginx pour éviter les doublons
        # (un X-Frame-Options en double est ignoré par certains navigateurs). La CSP vient uniquement de Laravel.
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header Referrer-Policy;
        fastcgi_hide_header Permissions-Policy;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
